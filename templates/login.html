<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Gated Community System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; width: 100%; max-width: 380px; }
        h2 { margin-top: 0; color: #1e293b; font-size: 22px; margin-bottom: 24px; text-align: center; }
        .alert { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 6px; text-transform: uppercase; }
        input { width: 100%; padding: 10px 14px; margin-bottom: 20px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { background-color: #4f46e5; color: white; padding: 12px; border: none; cursor: pointer; width: 100%; border-radius: 8px; font-size: 15px; font-weight: 600; }
        button:hover { background-color: #4338ca; }
        .portal-link { text-align: center; margin-top: 20px; font-size: 13px; }
        .portal-link a { color: #4f46e5; text-decoration: none; font-weight: 600; }
        .portal-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Admin Login</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>

            <button type="submit">Sign In</button>
        </form>

        <div class="portal-link">
            <a href="/resident_login">Switch to Resident Portal →</a>
        </div>
    </div>
</body>
</html>
